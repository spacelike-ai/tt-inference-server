openapi: 3.1.0
info:
  title: MiniMax-H3 Turbo Ref2VA generation API (tt-media-server)
  version: 0.1.0
  description: |
    What a `lightx2v/minimax-h3-turbo-ref2va` deployment serves: its submit endpoint
    and the common `/v1/jobs` API. Shared schemas, responses and auth live
    in `common.yaml`, which also describes the API as a whole.
security:
  - Bearer: []
paths:
  /v1/generations/lightx2v/minimax-h3-turbo-ref2va:
    post:
      operationId: submitMiniMaxH3TurboRef2VA
      tags: [MiniMax-H3 Turbo Ref2VA]
      summary: Submit a MiniMax-H3 Turbo references-to-video job
      description: |
        MiniMax-H3 Ref2VA (`minimaxai/minimax-h3-ref2va`) with lightx2v's
        4-step Ref2VA Turbo adapter: text and reference images, videos and
        audio clips to video with a soundtrack generated with it. The same
        request; 4 steps, fixed. Text alone, or keyframes, is
        `lightx2v/minimax-h3-turbo`, a separate deployment: it loads a
        different transformer and adapter.

        **Elsewhere:** tt-media-server today
        `POST /v1/videos/generations/ref2va`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniMaxH3TurboRef2VARequest"
            example:
              prompt: the woman from the photo sings the melody from the clip
              images: [https://example.com/woman.png]
              audios: [https://example.com/melody.wav]
      responses:
        "202":
          $ref: "../../common.yaml#/components/responses/Submitted"
        "400":
          $ref: "../../common.yaml#/components/responses/MediaUrlNotAllowed"
        "401":
          $ref: "../../common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "../../common.yaml#/components/responses/NotServed"
        "413":
          $ref: "../../common.yaml#/components/responses/MediaTooLarge"
        "422":
          $ref: "../../common.yaml#/components/responses/Invalid"
        "429":
          $ref: "../../common.yaml#/components/responses/QueueFull"
        "503":
          $ref: "../../common.yaml#/components/responses/Unavailable"
  /v1/jobs:
    $ref: ../../common.yaml#/paths/~1v1~1jobs
  /v1/jobs/{job_id}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D
  /v1/jobs/{job_id}/content/{index}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1content~1%7Bindex%7D
  /v1/jobs/{job_id}/cancel:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1cancel
components:
  schemas:
    MiniMaxH3TurboRef2VARequest:
      type: object
      additionalProperties: false
      required: [prompt]
      description: |
        At least one image or video; at most 12 references in total. The data
        URIs of one request are at most 64,000,000 characters together (413
        otherwise); send larger inputs by URL.
      properties:
        prompt:
          type: string
          minLength: 1
          description: |
            Describes the picture and the sound. At most 3008 tokens.

            **Elsewhere:** tt-media-server today `prompt`.
        images:
          type: array
          maxItems: 9
          default: []
          items:
            $ref: "../../common.yaml#/components/schemas/Media"
          description: |
            Reference images, each with a ratio from 1:4 to 4:1.

            **Elsewhere:** tt-media-server today `references.images[]`, each
            `{b64}` or `{url}`.
        videos:
          type: array
          maxItems: 3
          default: []
          items:
            $ref: "../../common.yaml#/components/schemas/VideoMedia"
          description: |
            Reference videos, each 2 to 15 s with a ratio from 1:4 to 4:1, at
            most 15 s together. A video's soundtrack is a reference too.

            **Elsewhere:** tt-media-server today `references.videos[]`.
        audios:
          type: array
          maxItems: 3
          default: []
          items:
            $ref: "../../common.yaml#/components/schemas/AudioMedia"
          description: |
            Reference audio clips, each 2 to 15 s, at most 15 s together. Only
            with at least one image or video.

            **Elsewhere:** tt-media-server today `references.audios[]`.
        aspect_ratio:
          type: string
          enum: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
          default: "16:9"
          description: |
            Output shape, unless `width` and `height` are set. The size
            follows: the short side 768, the area at most 768 × 1344, each side
            a multiple of 32 (`16:9` 1344×768, `21:9` 1536×672).

            **Elsewhere:** tt-media-server today `aspect_ratio`.
        width:
          type: integer
          minimum: 32
          multipleOf: 32
          description: |
            With `height`, the output shape in place of `aspect_ratio`: a
            multiple of 32, `width × height` at most 1,032,192, the ratio from
            1:4 to 4:1. It is resized like `aspect_ratio`, so it sets the
            shape, not the size: 832 × 480 gives 1344×768.

            **Elsewhere:** tt-media-server today `width`.
        height:
          type: integer
          minimum: 32
          multipleOf: 32
          description: |
            See `width`.

            **Elsewhere:** tt-media-server today `height`.
        duration:
          type: integer
          minimum: 4
          maximum: 15
          default: 5
          description: |
            Seconds. Generated at 24 fps and rounded up to the frame count the
            VAE takes (17n + 5), so 5 s is 124 frames; the output reports the
            exact `duration`.

            **Elsewhere:** tt-media-server today `duration`.
        seed:
          $ref: "../../common.yaml#/components/schemas/Seed"
          description: |
            Omitted = random. Each output reports the seed it was made with.

            **Elsewhere:** tt-media-server today `seed`, defaulting to 0.
