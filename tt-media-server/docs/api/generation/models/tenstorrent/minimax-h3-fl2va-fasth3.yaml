openapi: 3.1.0
info:
  title: MiniMax-H3 FL2VA FastH3 generation API (tt-media-server)
  version: 0.1.0
  description: |
    What a `tenstorrent/minimax-h3-fl2va-fasth3` deployment serves: its submit
    endpoint and the common `/v1/jobs` API. Shared schemas, responses and auth
    live in `common.yaml`, which also describes the API as a whole.
security:
  - Bearer: []
paths:
  /v1/generations/tenstorrent/minimax-h3-fl2va-fasth3:
    post:
      operationId: submitMiniMaxH3FastH3
      tags: [MiniMax-H3 FastH3]
      summary: Submit a MiniMax-H3 FastH3 text-to-video job
      description: |
        MiniMax-H3 with the FastH3 distilled adapter and sparse attention:
        text to video with a soundtrack generated with it. 4 steps, fixed. No
        keyframes; for those, `minimaxai/minimax-h3-fl2va`.

        **tt-media-server today:** `POST /v1/videos/generations`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniMaxH3FastH3Request"
            example:
              prompt: waves break on a rocky shore at dusk, gulls calling
              duration: 5
              seed: 1234
      responses:
        "202":
          $ref: "../../common.yaml#/components/responses/Submitted"
        "401":
          $ref: "../../common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "../../common.yaml#/components/responses/NotServed"
        "422":
          $ref: "../../common.yaml#/components/responses/Invalid"
        "429":
          $ref: "../../common.yaml#/components/responses/QueueFull"
        "503":
          $ref: "../../common.yaml#/components/responses/Unavailable"
  /v1/jobs:
    $ref: ../../common.yaml#/paths/~1v1~1jobs
  /v1/jobs/{job_id}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D
  /v1/jobs/{job_id}/content/{index}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1content~1%7Bindex%7D
  /v1/jobs/{job_id}/cancel:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1cancel
components:
  securitySchemes:
    Bearer:
      $ref: "../../common.yaml#/components/securitySchemes/Bearer"
  schemas:
    MiniMaxH3FastH3Request:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        aspect_ratio:
          type: string
          enum: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
          default: "16:9"
          description: |
            Output shape. Each output reports its exact size.
        size:
          type: string
          enum: [768p]
          default: 768p
          description: |
            Size tier: a short edge of 768, the area capped at 768×1344, sides
            multiples of 32 (`16:9` 1344×768, `21:9` 1536×672). Only `768p` for
            now; kept so other tiers can be added without a schema change.
        duration:
          type: integer
          minimum: 4
          maximum: 15
          default: 5
          description: |
            Seconds. The video runs at 24 fps and its length is rounded up to the
            frame counts the model generates (17k + 5): 5 s gives 124 frames
            (5.17 s). Each output reports its exact `duration` and
            `num_frames`.
        seed:
          $ref: "../../common.yaml#/components/schemas/Seed"
