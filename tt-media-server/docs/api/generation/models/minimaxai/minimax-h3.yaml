openapi: 3.1.0
info:
  title: MiniMax-H3 generation API (tt-media-server)
  version: 0.1.0
  description: |
    What a `minimaxai/minimax-h3` deployment serves: its submit endpoint and
    the common `/v1/jobs` API. Shared schemas, responses and auth live
    in `common.yaml`, which also describes the API as a whole.
security:
  - Bearer: []
paths:
  /v1/generations/minimaxai/minimax-h3:
    post:
      operationId: submitMiniMaxH3
      tags: [MiniMax-H3]
      summary: Submit a MiniMax-H3 text or keyframes to video job
      description: |
        Text to video with a soundtrack generated with it, optionally starting
        from `first_frame`, ending on `last_frame`, or both (FL2VA). 50 steps,
        fixed. Generating from reference images, videos and audio is
        `minimaxai/minimax-h3-ref2va`, a separate deployment: it loads a
        different transformer.

        **Elsewhere:** tt-media-server today `POST /v1/videos/generations`
        (text) and `POST /v1/videos/generations/i2v` (keyframes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniMaxH3Request"
            examples:
              text:
                summary: Text to video
                value:
                  prompt: waves break on a rocky shore at dusk, gulls calling
                  duration: 5
                  seed: 1234
              keyframes:
                summary: From a first and a last frame
                value:
                  prompt: the camera slowly pulls back from the lighthouse
                  first_frame: https://example.com/first.png
                  last_frame: https://example.com/last.png
      responses:
        "202":
          $ref: "../../common.yaml#/components/responses/Submitted"
        "400":
          $ref: "../../common.yaml#/components/responses/MediaUrlNotAllowed"
        "401":
          $ref: "../../common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "../../common.yaml#/components/responses/NotServed"
        "413":
          $ref: "../../common.yaml#/components/responses/MediaTooLarge"
        "422":
          $ref: "../../common.yaml#/components/responses/Invalid"
        "429":
          $ref: "../../common.yaml#/components/responses/QueueFull"
        "503":
          $ref: "../../common.yaml#/components/responses/Unavailable"
  /v1/jobs:
    $ref: ../../common.yaml#/paths/~1v1~1jobs
  /v1/jobs/{job_id}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D
  /v1/jobs/{job_id}/content/{index}:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1content~1%7Bindex%7D
  /v1/jobs/{job_id}/cancel:
    $ref: ../../common.yaml#/paths/~1v1~1jobs~1%7Bjob_id%7D~1cancel
components:
  schemas:
    MiniMaxH3Request:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: |
            Describes the picture and the sound. At most 3008 tokens.

            **Elsewhere:** tt-media-server today `prompt`.
        first_frame:
          $ref: "../../common.yaml#/components/schemas/Media"
          description: |
            The image the video starts from. Each side 256 to 5760 px, the
            ratio from 1:4 to 4:1. Stretched to the output size. Without
            `width` and `height`, the output takes its shape instead of
            `aspect_ratio`'s.

            **Elsewhere:** tt-media-server today `image_prompts[]` with
            `frame_pos: 0`.
        last_frame:
          $ref: "../../common.yaml#/components/schemas/Media"
          description: |
            The image the video ends on, with the same limits. With a
            `first_frame`, resized to fill the output and center-cropped;
            alone, stretched, and the output takes its shape as for
            `first_frame`.

            **Elsewhere:** tt-media-server today `image_prompts[]` with
            `frame_pos: -1`.
        aspect_ratio:
          type: string
          enum: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
          default: "16:9"
          description: |
            Output shape, unless `width` and `height` are set or a keyframe
            sets it. The size follows: the short side 768, the area at most
            768 × 1344, each side a multiple of 32 (`16:9` 1344×768, `21:9`
            1536×672).

            **Elsewhere:** tt-media-server today `aspect_ratio`.
        width:
          type: integer
          minimum: 32
          multipleOf: 32
          description: |
            With `height`, the output shape in place of `aspect_ratio`: a
            multiple of 32, `width × height` at most 1,032,192, the ratio from
            1:4 to 4:1. It is resized like `aspect_ratio`, so it sets the
            shape, not the size: 832 × 480 gives 1344×768.

            **Elsewhere:** tt-media-server today `width`.
        height:
          type: integer
          minimum: 32
          multipleOf: 32
          description: |
            See `width`.

            **Elsewhere:** tt-media-server today `height`.
        duration:
          type: integer
          minimum: 4
          maximum: 15
          default: 5
          description: |
            Seconds. Generated at 24 fps and rounded up to the frame count the
            VAE takes (17n + 5), so 5 s is 124 frames; the output reports the
            exact `duration`.

            **Elsewhere:** tt-media-server today `duration`.
        seed:
          $ref: "../../common.yaml#/components/schemas/Seed"
          description: |
            Omitted = random. Each output reports the seed it was made with.

            **Elsewhere:** tt-media-server today `seed`, defaulting to 0.
